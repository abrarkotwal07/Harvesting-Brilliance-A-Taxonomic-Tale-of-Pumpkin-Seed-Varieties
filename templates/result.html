<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pumpkin Classification Result</title>
  <link rel="stylesheet" href="/static/styles/style.css" />
</head>
<body>
  <div class="app-background">
    <div class="app-shell">
      <section class="card result-card">
        <h1 class="app-title">Pumpkin Classification Result</h1>

        <div class="result-banner">
          <span class="result-label">Predicted Category</span>
          <span class="result-value">
            {% if prediction == 0 %}
              Cercevelik
            {% elif prediction == 1 %}
              Urgup Sivrisi
            {% else %}
              Unknown
            {% endif %}
          </span>
        </div>

        <h3 class="section-heading">Input Measurements</h3>
        <div class="grid grid--summary">
          {% for feature, value in input_summary.items() %}
            <div class="summary-item">
              <span class="summary-label">{{ feature }}</span>
              <span class="summary-value">{{ value }}</span>
            </div>
          {% endfor %}
        </div>

        <div class="actions">
          <a href="/" class="primary-button is-link">Try Another Prediction</a>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
