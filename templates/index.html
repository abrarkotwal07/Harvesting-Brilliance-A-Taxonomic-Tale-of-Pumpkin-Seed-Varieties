<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pumpkin Category Classifier</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    
    <style>
        #loading-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-soft);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 16px;
        }

        .loading-text {
            color: var(--primary-color-strong);
            font-weight: 700;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-size: 0.9rem;
        }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div class="app-background">
        <div class="app-shell">
            
            <header class="app-header">
                <h1 class="app-title">Pumpkin Category Classifier</h1>
                <p class="app-subtitle">Provide the harvested pumpkin's measurements and we'll predict the most likely category.</p>
            </header>

            <main class="card">
                
                <div id="form-container">
                    <form action="/predict" method="POST" onsubmit="showLoading()">
                        
                        <div class="grid">
                            <div class="field">
                                <label>Area</label>
                                <input type="number" step="any" name="Area" placeholder=" e.g., 50000" required>
                            </div>
                            <div class="field">
                                <label>Perimeter</label>
                                <input type="number" step="any" name="Perimeter" placeholder="e.g., 800" required>
                            </div>
                            <div class="field">
                                <label>Major Axis Length</label>
                                <input type="number" step="any" name="Major_Axis_Length" placeholder="e.g., 400" required>
                            </div>
                            <div class="field">
                                <label>Minor Axis Length</label>
                                <input type="number" step="any" name="Minor_Axis_Length" placeholder="e.g., 200" required>
                            </div>

                            <div class="field">
                                <label>Convex Area</label>
                                <input type="number" step="any" name="Convex_Area" placeholder="e.g., 51000" required>
                            </div>
                            <div class="field">
                                <label>Equivalent Diameter</label>
                                <input type="number" step="any" name="Equiv_Diameter" placeholder="e.g., 250" required>
                            </div>
                            <div class="field">
                                <label>Eccentricity</label>
                                <input type="number" step="any" name="Eccentricity" placeholder="e.g., 0." required>
                            </div>
                            <div class="field">
                                <label>Solidity</label>
                                <input type="number" step="any" name="Solidity" placeholder="e.g., 0.95" required>
                            </div>

                            <div class="field">
                                <label>Extent</label>
                                <input type="number" step="any" name="Extent" placeholder="e.g., 0.7" required>
                            </div>
                            <div class="field">
                                <label>Roundness</label>
                                <input type="number" step="any" name="Roundness" placeholder="e.g., 0.9" required>
                            </div>
                            <div class="field">
                                <label>Aspect Ratio</label>
                                <input type="number" step="any" name="Aspect_Ration" placeholder="e.g., 2.0" required>
                            </div>
                            <div class="field">
                                <label>Compactness</label>
                                <input type="number" step="any" name="Compactness" placeholder="e.g., 0.85" required>
                            </div>
                        </div>

                        <div class="form-footer">
                            <button type="submit" class="primary-button">
                                <span>Predict Category</span>
                                <!-- <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg> -->
                            </button>
                        </div>
                    </form>
                </div>

                <div id="loading-screen">
                    <div class="spinner"></div>
                    <div class="loading-text">Analyzing Geometry...</div>
                </div>

            </main>

            <footer class="app-footer">
                <p class="footer-note">Powered by Abrar Kotwal</p>
            </footer>

        </div>
    </div>

    <script>
        function showLoading() {
            // Hide the form container
            document.getElementById('form-container').style.display = 'none';
            // Show the loading flex container
            document.getElementById('loading-screen').style.display = 'flex';
        }
    </script>

</body>
</html>
